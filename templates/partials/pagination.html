{# Pagination controls: Previous / page-number links / Next.#}
<nav class="pagination" id="pagination-nav" data-posts-per-page="{{ posts_per_page }}" hidden aria-label="Pagination">
    <button type="button" class="page-link page-link-prev" id="page-prev">&larr; Previous</button>
    <span class="page-numbers" id="page-numbers"></span>
    <button type="button" class="page-link page-link-next" id="page-next">Next &rarr;</button>
</nav>
